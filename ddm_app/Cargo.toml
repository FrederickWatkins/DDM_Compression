[package]
name = "ddm_app"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[features]
tokio = ["dep:tokio", "tokio/sync"]
crossbeam = ["dep:crossbeam", "dep:crossbeam-channel"]
flume = ["dep:flume"]
clap = ["dep:clap", "clap/derive"]

[lints]
workspace = true

[dependencies]
binrw = "0.15"
ddm_core = { path = "../ddm_core" }
ranges = "0.4"
tracing = "0.1"
prodash = { version = "31", features = ["unit-bytes", "unit-human"] }
human_format = "1"
anyhow = "1"
ndarray = "0.17"
tokio = { version = "1", optional = true }
crossbeam = { version = "0.8", optional = true }
flume = { version = "0.12", optional = true }
clap = { version = "4", optional = true }
thread-id = "5"
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
ddm_core = { path = "../ddm_core", features = ["proptest", "serde"] }
proptest = "1"
tempfile = "3"
