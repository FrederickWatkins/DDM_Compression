[package]
name = "ddm_app"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[features]
clap = ["dep:clap", "clap/derive"]

[lints]
workspace = true

[dependencies]
binrw = "0.15"
clap = { version = "4", optional = true }
comfy-table = "8"
ddm_core = { path = "../ddm_core" }
either = "1"
itertools = "0.15"
ranges = "0.4"
tracing = "0.1"
prodash = { version = "31", features = ["unit-bytes", "unit-human"] }
human_format = "1"
anyhow = "1"
rayon = "1.12.0"
ndarray = "0.17.2"

[dev-dependencies]
ddm_core = { path = "../ddm_core", features = ["proptest", "serde"] }
proptest = "1"
tempfile = "3"
