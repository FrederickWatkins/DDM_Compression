[package]
name = "ddm_core"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[features]
default = ["std"]
serde = ["dep:serde", "serde/derive", "ndarray/serde", "dep:serde-big-array"]
proptest = ["std", "dep:proptest", "dep:proptest-derive"]
std = ["serde/std", "binrw/std", "bitstream-io/std", "crc32fast/std"]
serde-big-array = ["dep:serde-big-array"]
alloc = []

[lints]
workspace = true

[dependencies]
binrw = "0.15"
ndarray = "0.17"
serde = { version = "1", optional = true }
thiserror = "2"
proptest = { version = "1", optional = true }
proptest-derive = { version = "0.9", optional = true }
serde-big-array = { version = "0.5", optional = true }
bitstream-io = "4.10.0"
crc32fast = "1.5.2"

[dev-dependencies]
proptest = "1"
proptest-derive = "0.9"
anyhow = "1"
