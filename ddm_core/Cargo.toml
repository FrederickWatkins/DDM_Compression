[package]
name = "ddm_core"
version = "0.1.0"
edition = "2024"

[features]
serde = ["dep:serde", "serde/derive", "ndarray/serde"]
proptest = ["dep:proptest", "dep:proptest-derive"]

[lints]
workspace = true

[dependencies]
binrw = "0.15"
ndarray = "0.17"
serde = { version = "1", optional = true }
thiserror = "2"
proptest = { version = "1", optional = true }
proptest-derive = { version = "0.9", optional = true }

[dev-dependencies]
proptest = "1"
proptest-derive = "0.9"
