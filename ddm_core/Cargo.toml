[package]
name = "ddm_core"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[features]
proptest = ["dep:proptest", "dep:proptest-derive"]
serde = ["dep:serde", "serde/derive", "ndarray/serde", "dep:serde-big-array"]

[lints]
workspace = true

[dependencies]
ndarray = "0.17"
serde = { version = "1", optional = true }
proptest = { version = "1", optional = true }
proptest-derive = { version = "0.9", optional = true }
serde-big-array = { version = "0.5", optional = true }
crc32fast = "1"
binrw = "0.15"
bitstream-io = "4"
snafu = "0.9"

[dev-dependencies]
proptest = "1"
proptest-derive = "0.9"
anyhow = "1"
image = "0.25.10"
itertools = "0.15.0"
